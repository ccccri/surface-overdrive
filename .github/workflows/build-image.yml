# Builds the Surface Overdrive image for each Fedora release and publishes it to ghcr.io/<owner>/surface-overdrive:<release>.
#
# It runs every day, because Kinoite publishes new kernels and packages all the time: the modules and libcamera must be rebuilt
# against exactly what the new base image contains. A day with the same base image and the same repository state builds nothing.
# A failed build opens (or updates) one Issue per release, with the link to the log.
#
# Secrets needed: MOK_KEY (PEM private key) and MOK_CERT_B64 (the certificate in DER form, base64): the module signing key whose
# certificate is enrolled in the tablet's firmware.
name: build-image

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "tools/dev/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: ["44", "45"]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/surface-overdrive
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

      - name: Find the base image and its kernel
        id: detect
        run: |
          eval "$(ci/detect.sh '${{ matrix.release }}')"
          echo "BASE=$BASE" >> "$GITHUB_OUTPUT"
          echo "KVER=$KVER" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base $BASE ($DIGEST), kernel $KVER"

      - name: Is there anything new to build?
        id: changed
        run: |
          current=$(skopeo inspect --no-tags --retry-times 3 --override-os linux "docker://$IMAGE:${{ matrix.release }}" 2>/dev/null \
            | python3 -c 'import json,sys; l=json.load(sys.stdin)["Labels"]; print(l.get("org.surfaceoverdrive.base-digest",""), l.get("org.surfaceoverdrive.source-sha",""))' || true)
          wanted="${{ steps.detect.outputs.digest }} ${{ github.sha }}"
          if [ "$current" = "$wanted" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "Already published: $current"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Make room on the runner
        if: steps.changed.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Signing key
        id: key
        if: steps.changed.outputs.build == 'true'
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
          MOK_CERT_B64: ${{ secrets.MOK_CERT_B64 }}
        run: |
          # Without the signing key the modules cannot be signed for Secure Boot: nothing to build yet, and that is not a
          # failure (no red run, no Issue, no mail) until the key is set up.
          if [ -z "$MOK_KEY" ] || [ -z "$MOK_CERT_B64" ]; then
            echo "::notice::the MOK_KEY and MOK_CERT_B64 secrets are not set: the image is not built"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          umask 077; mkdir -p "$RUNNER_TEMP/key"
          printf '%s\n' "$MOK_KEY" > "$RUNNER_TEMP/key/key.pem"
          printf '%s' "$MOK_CERT_B64" | base64 -d > "$RUNNER_TEMP/key/cert.der"

      - name: Build
        if: steps.changed.outputs.build == 'true' && steps.key.outputs.ready == 'true'
        run: |
          # the base images first, with retries: quay.io's CDN now and then cuts a layer download ("unexpected EOF"),
          # which failed the whole build (2026-10-26); podman build then finds them here and does not pull again
          for ref in "${{ steps.detect.outputs.BASE }}" "registry.fedoraproject.org/fedora:${{ matrix.release }}"; do
            for attempt in 1 2 3 4; do
              podman pull -q "$ref" >/dev/null && break
              [ "$attempt" = 4 ] && exit 1
              echo "pull of $ref failed (attempt $attempt), again in $((attempt * 30)) s"; sleep $((attempt * 30))
            done
          done
          podman build \
            --build-arg "BASE=${{ steps.detect.outputs.BASE }}" --build-arg "FEDORA=${{ matrix.release }}" \
            --build-arg "KVER=${{ steps.detect.outputs.KVER }}" \
            --build-arg "BASE_DIGEST=${{ steps.detect.outputs.digest }}" --build-arg "SOURCE_SHA=${{ github.sha }}" \
            --secret "id=modkey,src=$RUNNER_TEMP/key/key.pem" --secret "id=modcert,src=$RUNNER_TEMP/key/cert.der" \
            -t "$IMAGE:${{ matrix.release }}" .
          rm -rf "$RUNNER_TEMP/key"

      - name: Publish
        if: steps.changed.outputs.build == 'true' && steps.key.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          stamp=$(date -u +%Y%m%d)
          podman tag "$IMAGE:${{ matrix.release }}" "$IMAGE:${{ matrix.release }}-$stamp"
          # the registry now and then refuses a layer upload (HTTP 400 after minutes): try again before giving up
          push() {
            for attempt in 1 2 3 4; do
              podman push "$1" && return 0
              echo "push of $1 failed (attempt $attempt), again in $((attempt * 60)) s"; sleep $((attempt * 60))
            done
            return 1
          }
          push "$IMAGE:${{ matrix.release }}"
          push "$IMAGE:${{ matrix.release }}-$stamp"

      - name: Open or update an Issue when the build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Image build failed for Fedora ${{ matrix.release }}"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf 'The scheduled build of the image for Fedora %s failed.\n\nRun: %s\nBase: %s\nKernel: %s\nCommit: %s\n\nOpen the log, find the first red step, and fix it with Claude (paste the log and this Issue).' \
            "${{ matrix.release }}" "$url" "${{ steps.detect.outputs.BASE }}" "${{ steps.detect.outputs.KVER }}" "$GITHUB_SHA")
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the Issue when the build works again
        if: success() && steps.changed.outputs.build == 'true' && steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Image build failed for Fedora ${{ matrix.release }}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          [ -z "$number" ] || gh issue close "$number" --comment "Fixed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
