# Surface Overdrive (PC companion): Bazzite's v4l2loopback device, which surface-av feeds with the Surface's front camera,
# is listed as "Surface Camera" by apps that take cameras from PipeWire (Firefox, OBS, the camera portal) instead of
# "OBS Virtual Camera". Apps opening the V4L2 device themselves read the kernel's label: see the README (card_label).
monitor.v4l2.rules = [
  {
    # by udev's product name (the device) and by its place in sysfs (its nodes): v4l2's own card label comes too late
    matches = [ { device.product.name = "OBS Virtual Camera" } { node.name = "~v4l2_input._sys_devices_virtual_video4linux_.*" } ]
    actions = { update-props = { device.description = "Surface Camera", node.description = "Surface Camera", node.nick = "Surface Camera" } }
  }
]
