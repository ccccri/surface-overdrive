# Surface Overdrive: kernel dumps from persistent storage (EFI variables) go to the journal, not to files.
# With Fedora 45's SELinux policy systemd-pstore may not create its per-boot directories under /var/lib/systemd/pstore
# (avc: denied { create } ... tclass=dir), so the records were never archived and their EFI variables never deleted: with
# printk.always_kmsg_dump=Y (a karg kept on the tablet to find why it sometimes powers off by itself) a set of them is
# written at every shutdown and the firmware's small variable store would fill up. In the journal they are read with
# journalctl -b -1 -u systemd-pstore (or -t systemd-pstore).
[PStore]
Storage=journal
Unlink=yes
