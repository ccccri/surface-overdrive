# Surface Overdrive: not on an ostree system. A fresh Fedora 45 install lists / as "ro" in /etc/fstab, and this service
# tried to remount the composefs root by those options, which composefs refuses ("overlay: No changes allowed in
# reconfigure"): a failed unit at every boot. ostree-remount.service does the remounting an ostree system needs.
[Unit]
ConditionPathExists=!/run/ostree-booted
