# Surface Overdrive: only when /boot can be written. A fresh Fedora 45 install mounts /boot read-only, and marking the
# boot as successful in GRUB's environment block failed at every login ("Creating tmpfile failed: Read-only file
# system"). The image's GRUB menu shows its 3 s countdown at every start anyway (overdrive-bootconfig).
[Unit]
ConditionPathIsReadWrite=/boot
