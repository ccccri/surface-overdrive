# Surface Overdrive: the owner's panel settings on a panel made before the switch to the image, written into Plasma's
# files before plasmashell reads them, once per user (src/overdrive/paneldefaults.py). Doing it from a Plasma update
# script while plasmashell started left the session without its panel.
[Service]
ExecStartPre=-/usr/libexec/overdrive/panel-defaults
