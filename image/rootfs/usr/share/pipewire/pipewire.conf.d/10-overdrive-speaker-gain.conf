# Speaker chain of Surface Overdrive: pre-amplifier, ten parametric bands (biquads whose frequency, Q and gain are set live), then the speaker boost.
# The Surface Go speakers are quiet: the boost is a fixed digital gain, (percent / 100)^3 because PipeWire volumes are cubic. The physical sink
# must stay at 100%. Generated by overdrive.audio.eq.conf_text(); the values here are what the chain starts with, the user's equaliser sets are applied on top at login.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Built-in Speakers (boosted)"
      media.name       = "Built-in Speakers (boosted)"
      filter.graph = {
        nodes = [
          { type = builtin name = preL label = linear control = { "Mult" = 1.00000 "Add" = 0.0 } }
          { type = builtin name = eqL0p label = bq_peaking control = { "Freq" = 1000.00 "Q" = 0.707 "Gain" = 0.000 } }
          { type = builtin name = eqL0l label = bq_lowshelf control = { "Freq" = 60.00 "Q" = 0.710 "Gain" = 0.000 } }
          { type = builtin name = eqL0h label = bq_highpass control = { "Freq" = 5.00 "Q" = 0.707 "Gain" = 0.000 } }
          { type = builtin name = eqL1p label = bq_peaking control = { "Freq" = 120.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqL2p label = bq_peaking control = { "Freq" = 250.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqL3p label = bq_peaking control = { "Freq" = 500.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqL4p label = bq_peaking control = { "Freq" = 1000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqL5p label = bq_peaking control = { "Freq" = 2000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqL6p label = bq_peaking control = { "Freq" = 4000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqL7p label = bq_peaking control = { "Freq" = 8000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqL8p label = bq_peaking control = { "Freq" = 12000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqL9p label = bq_peaking control = { "Freq" = 1000.00 "Q" = 0.707 "Gain" = 0.000 } }
          { type = builtin name = eqL9h label = bq_highshelf control = { "Freq" = 14000.00 "Q" = 0.710 "Gain" = 0.000 } }
          { type = builtin name = eqL9l label = bq_lowpass control = { "Freq" = 23000.00 "Q" = 0.707 "Gain" = 0.000 } }
          { type = builtin name = gainL label = linear control = { "Mult" = 1.72800 "Add" = 0.0 } }
          { type = builtin name = preR label = linear control = { "Mult" = 1.00000 "Add" = 0.0 } }
          { type = builtin name = eqR0p label = bq_peaking control = { "Freq" = 1000.00 "Q" = 0.707 "Gain" = 0.000 } }
          { type = builtin name = eqR0l label = bq_lowshelf control = { "Freq" = 60.00 "Q" = 0.710 "Gain" = 0.000 } }
          { type = builtin name = eqR0h label = bq_highpass control = { "Freq" = 5.00 "Q" = 0.707 "Gain" = 0.000 } }
          { type = builtin name = eqR1p label = bq_peaking control = { "Freq" = 120.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqR2p label = bq_peaking control = { "Freq" = 250.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqR3p label = bq_peaking control = { "Freq" = 500.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqR4p label = bq_peaking control = { "Freq" = 1000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqR5p label = bq_peaking control = { "Freq" = 2000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqR6p label = bq_peaking control = { "Freq" = 4000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqR7p label = bq_peaking control = { "Freq" = 8000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqR8p label = bq_peaking control = { "Freq" = 12000.00 "Q" = 1.000 "Gain" = 0.000 } }
          { type = builtin name = eqR9p label = bq_peaking control = { "Freq" = 1000.00 "Q" = 0.707 "Gain" = 0.000 } }
          { type = builtin name = eqR9h label = bq_highshelf control = { "Freq" = 14000.00 "Q" = 0.710 "Gain" = 0.000 } }
          { type = builtin name = eqR9l label = bq_lowpass control = { "Freq" = 23000.00 "Q" = 0.707 "Gain" = 0.000 } }
          { type = builtin name = gainR label = linear control = { "Mult" = 1.72800 "Add" = 0.0 } }
        ]
        links = [
          { output = "preL:Out" input = "eqL0p:In" }
          { output = "eqL0p:Out" input = "eqL0l:In" }
          { output = "eqL0l:Out" input = "eqL0h:In" }
          { output = "eqL0h:Out" input = "eqL1p:In" }
          { output = "eqL1p:Out" input = "eqL2p:In" }
          { output = "eqL2p:Out" input = "eqL3p:In" }
          { output = "eqL3p:Out" input = "eqL4p:In" }
          { output = "eqL4p:Out" input = "eqL5p:In" }
          { output = "eqL5p:Out" input = "eqL6p:In" }
          { output = "eqL6p:Out" input = "eqL7p:In" }
          { output = "eqL7p:Out" input = "eqL8p:In" }
          { output = "eqL8p:Out" input = "eqL9p:In" }
          { output = "eqL9p:Out" input = "eqL9h:In" }
          { output = "eqL9h:Out" input = "eqL9l:In" }
          { output = "eqL9l:Out" input = "gainL:In" }
          { output = "preR:Out" input = "eqR0p:In" }
          { output = "eqR0p:Out" input = "eqR0l:In" }
          { output = "eqR0l:Out" input = "eqR0h:In" }
          { output = "eqR0h:Out" input = "eqR1p:In" }
          { output = "eqR1p:Out" input = "eqR2p:In" }
          { output = "eqR2p:Out" input = "eqR3p:In" }
          { output = "eqR3p:Out" input = "eqR4p:In" }
          { output = "eqR4p:Out" input = "eqR5p:In" }
          { output = "eqR5p:Out" input = "eqR6p:In" }
          { output = "eqR6p:Out" input = "eqR7p:In" }
          { output = "eqR7p:Out" input = "eqR8p:In" }
          { output = "eqR8p:Out" input = "eqR9p:In" }
          { output = "eqR9p:Out" input = "eqR9h:In" }
          { output = "eqR9h:Out" input = "eqR9l:In" }
          { output = "eqR9l:Out" input = "gainR:In" }
        ]
        inputs  = [ "preL:In" "preR:In" ]
        outputs = [ "gainL:Out" "gainR:Out" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "boosted_speakers"
        media.class = Audio/Sink
        priority.session = 2000
        priority.driver = 2000
      }
      playback.props = {
        node.name = "boosted_speakers_out"
        node.passive = true
        target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
      }
    }
  }
]
