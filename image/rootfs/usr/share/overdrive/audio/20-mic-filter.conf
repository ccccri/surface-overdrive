# Internal microphone, step 1: WebRTC noise suppression and a high-pass on the built-in microphone, published as "Built-in Microphone (filtered)".
# Copied to ~/.config/pipewire/pipewire.conf.d/ by "overdrivectl audio mic enable" (Surface Control > Sound).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      # Take the playback reference from the monitor of the default output instead of creating a sink for it: that sink showed up
      # among the outputs as "(unused) mic filter reference", and choosing it sent the sound nowhere.
      monitor.mode = true
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.high_pass_filter  = true
        webrtc.gain_control      = false
      }
      capture.props  = { node.name = "mic_filter_capture"  node.passive = true
                         target.object = "alsa_input.pci-0000_00_1f.3.analog-stereo" }
      source.props   = { node.name = "mic_filtered" node.description = "Built-in Microphone (noise filter, used by the enhanced one)"
                         media.class = Audio/Source priority.session = 500 priority.driver = 500 }
      playback.props = { node.name = "mic_filter_playback" node.passive = true }
    }
  }
]
