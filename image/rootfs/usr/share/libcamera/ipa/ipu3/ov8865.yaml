  - BlackLevelCorrection:
      # Black level of Gr, R, B, Gb in the units of the ImgU's optical black, about twice the sensor's 10-bit codes (the
      # sensor's pedestal is 16 with the lens pressed against a table). Measured with tools/calib/shading_probe.py on a flat
      # at a low signal level, where a wrong black shows most: what is left of the pedestal is blown up by the lens shading
      # gains in the corners (pink with too little, green with too much: up to +11% red with 16 in the 3200x2400 mode).
      # The full resolution modes need 34, the 2x2 binned ones 30 ("blackBinned", patch 0022); each keeps the corners
      # within 2% of the centre.
      black: [ 34, 34, 34, 34 ]
      blackBinned: [ 30, 30, 30, 30 ]
  - ToneMapping:
      # The sRGB transfer curve that displays and viewers expect. The default (a 1.1 power, nearly linear) read as sRGB
      # raised every colour ratio to about the power 2: pictures came out about twice as saturated as an iPhone's of the
      # same scene, reds turned to crimson and a warm light to orange (2026-10-18).
      curve: srgb
