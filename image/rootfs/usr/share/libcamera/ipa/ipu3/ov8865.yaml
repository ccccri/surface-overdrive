# SPDX-License-Identifier: CC0-1.0
# Surface Go IPU3 tuning (used for both the OV5693 front and OV8865 rear sensor).
# Installed to /usr/share/libcamera/ipa/ipu3/<sensor>.yaml, found by libcamera before the stock uncalibrated.yaml.
#
# The stock "uncalibrated.yaml" aims at a mean luminance of 0.16 and only forces the brightest 2% of the histogram
# to 0.5, so in a backlit scene (window behind you) the exposure follows the window and everything else is black
# (measured: 83% of pixels < 20/255). Here:
#  - relativeLuminanceTarget 0.16 and a lower constraint on the 25-55% quantile band >= 0.06 (0.30 and 0.18 while the tone
#    curve was nearly linear; the sRGB curve now lifts the midtones itself): shadows/midtones stay visible even if the
#    window clips. Replaces the default "top 2% >= 0.5" constraint (only one lower bound per mode is allowed).
# Measured on the same backlit scene: dark pixels 83% -> ~4%, median luma 0 -> ~120/255, colours stay neutral.
# Colour (Awb "ccms") and lens shading (Lsc) are our own calibration with tools/calib (2026-10-18): the matrix from the 24
# colours of a chart shown one at a time on a whole laptop screen and measured on the optical axis (ccm_screen.py, mean
# error 0.006 linear), the shading table with its brightness from paper on the laptop screen showing white, the camera
# pressed against it (screen.py; mean of one sheet and four), and its colour from a matt white sheet lit from the front by
# a window (lsc_colour.py): light leaving backlit paper at a slant is warmer, which made the corners 8% too red in the
# first and left a pink centre in pictures; the second has no diffuser in the way.
# One matrix and one shading table for every white point (measured in daylight); the white balance is held to the line of
# real lights ("locus", patch 0023).
version: 1
algorithms:
  - Af:
  - Agc:
      relativeLuminanceTarget: [ 0, 0.16 ]
      AeConstraintMode:
        ConstraintNormal:
          lower:
            qLo: 0.25
            qHi: 0.55
            yTarget: [ 0, 0.06 ]
  - Awb:
      # White points of real lights, [ R/G, B/G ] of a white sheet in the raw data (patch 0023), warm to cool: a dual
      # white LED desk lamp at its five settings, then daylight through a window and a laptop screen's D65 white. The
      # room's ceiling light (0.630, 0.493) sits 0.05 to the green side of the line, inside locusGreen.
      locus:
        - [ 0.779, 0.414 ]
        - [ 0.708, 0.473 ]
        - [ 0.638, 0.525 ]
        - [ 0.573, 0.577 ]
        - [ 0.513, 0.627 ]
        - [ 0.493, 0.685 ]
        - [ 0.485, 0.727 ]
      locusGreen: 0.06
      locusMagenta: 0.02
      locusExtend: 0.15
      ccms:
      - ct: 5404
        ccm: [ 1.8012, -1.0277, 0.2266, -0.2404, 1.3808, -0.1403, 0.0224, -0.7455, 1.7231 ]
