# SPDX-License-Identifier: CC0-1.0
# Surface Go front camera (OV5693), our own tuning for the IPU3 IPA (with the patches in patches/libcamera).
#
# Tuned on 2026-10-25 against a phone picture of the same room (skin, a light blue wall, a white ceiling, black cloth),
# trying several variants on the same scene in both sensor modes (2x2 binned for the 1152x864 preview, full resolution
# for 2560x1920 pictures):
#  - 2026-10-26: judged again with the colours read right (patch 0029: limited-range BT.709 out of the ImgU, the colour
#    space applications assume). Skin hue 25 degrees, saturation 0.35 (a colour chart's light skin: 19, 0.33); the
#    light blue wall as saturated as on the phone. Contrast 0.45 -> 0.7 for blacks that read as black.
#  - Lens shading: our table from a box brightness and a front-lit sheet colour (2026-10-19).
#  - Black level per channel and per mode: the red and blue channels need a few codes more than green, or dark things
#    (black cloth, hair) turn magenta once the white balance gains multiply what is left of the pedestal.
#  - No full colour matrix: the one measured on a laptop screen made skin pink and hair purple and raised the colour
#    noise by a quarter. A small hand-made matrix only turns reds a little towards yellow (skin hue 14 -> 22 degrees,
#    the phone's is 21), with rows summing to 1 so that greys stay grey.
#  - Tone: gamma 1.5 with an S curve (contrast 0.45), mean target 0.20 and a floor for the 25-55% band, so that a face
#    in front of a bright window stays visible.
#  - Noise: XNR3 of the ImgU turned on for chroma (patch 0026): measured on a static scene, the chroma blotches drop by
#    about a quarter in the shadows and almost half in the midtones at full resolution (10-15% in the binned mode),
#    colours and detail unchanged. The luma grain is the sensor's: at the gains of daylight the Bayer denoiser does not
#    act, and stronger software temporal filtering would smear moving things.
version: 1
algorithms:
  - Af:
  - Agc:
      relativeLuminanceTarget: [ 0, 0.20 ]
      AeConstraintMode:
        ConstraintNormal:
          lower:
            qLo: 0.25
            qHi: 0.55
            yTarget: [ 0, 0.09 ]
  - Awb:
      # White points of real lights, [ R/G, B/G ] of a white sheet in the raw data (patch 0023), warm to cool: a dual
      # white LED desk lamp at its five settings, a laptop screen's D65 white and daylight through a window. The room's
      # ceiling light (0.658, 0.512) sits on the line, between the lamp's settings 2 and 3.
      locus:
        - [ 0.792, 0.410 ]
        - [ 0.740, 0.448 ]
        - [ 0.680, 0.485 ]
        - [ 0.626, 0.518 ]
        - [ 0.583, 0.548 ]
        - [ 0.554, 0.678 ]
        - [ 0.529, 0.676 ]
      locusGreen: 0.06
      locusMagenta: 0.02
      locusExtend: 0.15
      # Not a measured matrix: a small turn of reds towards yellow, see the top of the file.
      ccms:
        - ct: 5201
          ccm: [ 1.03, -0.03, 0, 0.10, 0.90, 0, 0, -0.02, 1.02 ]
  - BlackLevelCorrection:
      # Black level of Gr, R, B, Gb in the units of the ImgU's optical black (about twice the sensor's codes); blackBinned
      # for the 2x2 binned mode (patch 0022). Set so that black cloth comes out neutral in both modes.
      black: [ 19, 27, 23, 19 ]
      blackBinned: [ 26, 31, 29, 26 ]
      # Bayer noise reduction [cf, cg, alpha, beta, gamma, max_inf] (patch 0003), as in the previous project's front preset.
      bnr: [ 1700, 24, 4, 8, 8, 10 ]
  - ToneMapping:
      gamma: 1.5
      contrast: 0.7
  - Lsc:
      cell: 64
      grid: [ 41, 31 ]
