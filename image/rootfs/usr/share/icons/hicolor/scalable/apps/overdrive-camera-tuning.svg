<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Surface Overdrive: tuning of the cameras (the tour's entry for the Embedded Cameras page): a lens beside three
       sliders, so that it does not read as the Camera app's icon -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#566069"/><stop offset="1" stop-color="#31363b"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cd0f7"/><stop offset="1" stop-color="#1d7fc4"/></linearGradient>
  </defs>
  <rect x="2" y="4" width="28" height="24" rx="3" fill="url(#panel)"/>
  <circle cx="10" cy="16" r="6" fill="#eff0f1"/>
  <circle cx="10" cy="16" r="4.2" fill="url(#glass)"/>
  <circle cx="8.6" cy="14.6" r="1.2" fill="#ffffff" opacity="0.75"/>
  <g stroke="#eff0f1" stroke-width="1.6" stroke-linecap="round">
    <line x1="19" y1="10" x2="27" y2="10"/>
    <line x1="19" y1="16" x2="27" y2="16"/>
    <line x1="19" y1="22" x2="27" y2="22"/>
  </g>
  <circle cx="24.5" cy="10" r="2" fill="#f67400"/>
  <circle cx="21" cy="16" r="2" fill="#3daee9"/>
  <circle cx="25.5" cy="22" r="2" fill="#27ae60"/>
</svg>
