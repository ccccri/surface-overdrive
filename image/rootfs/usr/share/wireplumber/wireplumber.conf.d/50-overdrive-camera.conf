# Cameras: hand a picture buffer back to the camera only when the application has returned it ("reliable" transport).
#
# By default PipeWire gives a buffer back one cycle after it was sent, whether or not the application is done with it. With four buffers
# the camera writes the next picture into it a few frames later: an application that is slower than that (a preview scaling 7.7 megapixel
# pictures, a recorder) reads a buffer while it is being overwritten, and shows pictures made of rectangles of two different frames.
# Measured on the rear camera at 3200x2400 with a slow reader: 24 damaged frames of 120 without this, 0 of 120 with it.
# The price: with two applications on the same camera at once, only the first one gets pictures.
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*" } ]
    actions = { update-props = { node.reliable = true } }
  }
]
