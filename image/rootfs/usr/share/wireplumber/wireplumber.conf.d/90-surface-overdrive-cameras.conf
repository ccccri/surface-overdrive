# Surface Overdrive: the cameras get a WirePlumber instance of their own (wireplumber@video-capture.service), and the main
# one leaves them alone. The picture sizes a camera offers are read when its node is made, so a change of size in the
# Cameras page has to restart what made the node: restarting the main instance also took the sound devices away and back
# (Plasma showed "Built-in Audio Analog Stereo") and left the preview without a camera for a few seconds.
wireplumber.profiles = {
  main = {
    hardware.video-capture = disabled
  }
}
