# Surface Overdrive: a camera no one uses is suspended at once (WirePlumber waits 5 s for any idle node).
# The two cameras share the image processor's links: while one of them still runs, the other one cannot be configured
# ("Device or resource busy"), and a browser switching from the front camera to the rear one got no frames from the rear
# (Firefox 159, tools/camera-test). The camera's light goes off at once too. Opening a suspended camera takes about
# 0.3 s. Used by the camera instance (wireplumber@video-capture), which makes the camera nodes.
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "~libcamera_input.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0.05 } }
  }
]
