# Surface Overdrive: the cameras' names in applications and browsers ("Built-in Front Camera" and "Built-in Back Camera"
# by default). WirePlumber applies these after its own naming.
monitor.libcamera.rules = [
  {
    matches = [ { api.libcamera.location = "front" } ]
    actions = { update-props = { node.description = "Surface Front Camera" } }
  }
  {
    matches = [ { api.libcamera.location = "back" } ]
    actions = { update-props = { node.description = "Surface Rear Camera" } }
  }
]
