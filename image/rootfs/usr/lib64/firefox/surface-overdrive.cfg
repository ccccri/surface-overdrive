// Surface Overdrive autoconfig (first line must be a comment).
// The voice search button (voice-search@surfaceoverdrive.org) goes right of the address bar, once per profile. Its
// manifest asks for the toolbar ("default_area": "navbar"), but Firefox puts a new button at the end of the toolbar,
// next to the extensions menu, and an extension cannot say where. Once it has been placed (pref
// surfaceoverdrive.voiceSearchPlaced) the user's own moves stay.
try {
  const WIDGET = "voice-search_surfaceoverdrive_org-browser-action";
  const DONE = "surfaceoverdrive.voiceSearchPlaced";
  const place = (CustomizableUI) => {
    if (Services.prefs.getBoolPref(DONE, false)) {
      return true;
    }
    const url = CustomizableUI.getPlacementOfWidget("urlbar-container");
    const mine = CustomizableUI.getPlacementOfWidget(WIDGET);
    if (!url || !mine) {
      return false;
    }
    if (mine.area !== url.area) {
      CustomizableUI.addWidgetToArea(WIDGET, url.area, url.position + 1);
    } else if (mine.position !== url.position + 1) {
      CustomizableUI.moveWidgetWithinArea(WIDGET, mine.position < url.position ? url.position : url.position + 1);
    }
    Services.prefs.setBoolPref(DONE, true);
    return true;
  };
  Services.obs.addObserver(function observer() {
    Services.obs.removeObserver(observer, "browser-delayed-startup-finished");
    let CustomizableUI;
    for (const url of ["moz-src:///browser/components/customizableui/CustomizableUI.sys.mjs",   // Firefox 150 on
                       "resource:///modules/CustomizableUI.sys.mjs"]) {
      try {
        ({ CustomizableUI } = ChromeUtils.importESModule(url));
        break;
      } catch (e) {}
    }
    if (!CustomizableUI) {
      return;
    }
    if (place(CustomizableUI)) {
      return;
    }
    // the extension's button is made a moment later, when the extension starts
    const listener = {
      onWidgetAdded(id) {
        if (id === WIDGET && place(CustomizableUI)) {
          CustomizableUI.removeListener(listener);
        }
      },
      onWidgetAfterCreation(id) {
        this.onWidgetAdded(id);
      },
    };
    CustomizableUI.addListener(listener);
  }, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError("surface-overdrive.cfg: " + e);
}
